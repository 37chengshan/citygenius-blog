name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "7 * * * *" # 每小时刷新一次新闻（避开整点）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh news
        run: node scripts/fetch-news.mjs
        continue-on-error: true
        env:
          NEWS_LLM_API_KEY: ${{ secrets.NEWS_LLM_API_KEY }}
          NEWS_LLM_BASE_URL: ${{ vars.NEWS_LLM_BASE_URL }}
          NEWS_LLM_MODEL: ${{ vars.NEWS_LLM_MODEL }}
          NEWS_AIHOT: ${{ vars.NEWS_AIHOT }}
      - name: Build with Astro
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
